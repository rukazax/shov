<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800" role="img" aria-label="Шов. Книга двенадцатая: Двое — обложка">
  <defs>
    <linearGradient id="sky12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060a"/>
      <stop offset="0.34" stop-color="#070d15"/>
      <stop offset="0.68" stop-color="#0a1420"/>
      <stop offset="1" stop-color="#03060b"/>
    </linearGradient>
    <radialGradient id="core12" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#d6ecff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#8fbfe8" stop-opacity="0.18"/>
      <stop offset="0.75" stop-color="#3d5c7c" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#080e16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfeaf6" stop-opacity="0.92"/>
      <stop offset="0.6" stop-color="#b9cfe6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7e97b0" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="thread12" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ccaf0" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#bcdcf6" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#e8f5ff" stop-opacity="0.85"/>
      <stop offset="0.72" stop-color="#bcdcf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9ccaf0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1520"/>
      <stop offset="1" stop-color="#020508"/>
    </linearGradient>
    <radialGradient id="vignette12" cx="0.5" cy="0.42" r="0.92">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.82"/>
    </radialGradient>
    <filter id="soft12"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="soft12b"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="grain12">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="1800" fill="url(#sky12)"/>

  <!-- стол: две плоскости сходятся к центру -->
  <g>
    <path d="M0 1560 L600 1130 L600 1800 L0 1800 Z" fill="url(#floor12)"/>
    <path d="M1200 1560 L600 1130 L600 1800 L1200 1800 Z" fill="#060c14"/>
    <g stroke="#243a4e" stroke-width="2" opacity="0.55">
      <path d="M120 1520 L590 1140"/><path d="M120 1580 L590 1190"/>
      <path d="M120 1640 L590 1240"/><path d="M120 1700 L590 1290"/>
      <path d="M1080 1520 L610 1140"/><path d="M1080 1580 L610 1190"/>
      <path d="M1080 1640 L610 1240"/><path d="M1080 1700 L610 1290"/>
    </g>
  </g>

  <!-- свет над книгой -->
  <ellipse cx="600" cy="1210" rx="430" ry="250" fill="url(#core12)" filter="url(#soft12)" opacity="0.5"/>

  <!-- раскрытая книга -->
  <g>
    <path d="M600 1250 L392 1180 L372 1420 L600 1492 Z" fill="url(#page12)"/>
    <path d="M600 1250 L808 1180 L828 1420 L600 1492 Z" fill="url(#page12)" opacity="0.88"/>
    <path d="M600 1250 L600 1492" stroke="#5d748c" stroke-width="4" opacity="0.8"/>
    <!-- две строки на левой странице: две записи одной фамилии -->
    <g stroke="#2a3d52" stroke-width="6" opacity="0.55" stroke-linecap="round">
      <path d="M430 1300 L566 1332"/><path d="M430 1340 L566 1372"/>
      <path d="M430 1380 L520 1402"/>
    </g>
    <!-- двойная строка справа: одна зачёркнута -->
    <g stroke="#2a3d52" stroke-width="6" opacity="0.55" stroke-linecap="round">
      <path d="M634 1332 L770 1300"/><path d="M634 1372 L770 1340"/>
      <path d="M634 1412 L724 1390"/>
    </g>
    <path d="M622 1330 L782 1294" stroke="#cfe8ff" stroke-width="5" opacity="0.75"/>
    <!-- штамп на правой странице -->
    <g transform="rotate(-6 700 1440)" opacity="0.85">
      <rect x="650" y="1408" width="160" height="72" fill="none" stroke="#cfe8ff" stroke-width="4" opacity="0.7"/>
      <text x="664" y="1460" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="46"
            font-weight="700" fill="#cfe8ff" opacity="0.8" letter-spacing="4">ДВОЕ</text>
    </g>
  </g>

  <!-- нить шва: тянется от левой фигуры через книгу к правой -->
  <path d="M300 1180 C 430 1210, 500 1240, 600 1250 C 700 1240, 790 1210, 900 1180"
        stroke="url(#thread12)" stroke-width="3" fill="none" opacity="0.9"/>
  <path d="M300 1180 C 430 1210, 500 1240, 600 1250 C 700 1240, 790 1210, 900 1180"
        stroke="#e8f5ff" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- две одинаковые фигуры: слева и справа, лицом к книге -->
  <g fill="#02050a">
    <g transform="translate(-90,0)">
      <ellipse cx="300" cy="1500" rx="58" ry="8" opacity="0.5" fill="#010306" filter="url(#soft12b)"/>
      <path d="M274 1498 L280 1330 L320 1330 L326 1498 Z"/>
      <path d="M278 1336 C 282 1258 322 1252 330 1282 L334 1332 C 324 1346 300 1348 288 1340 Z"/>
      <circle cx="312" cy="1232" r="24"/>
      <path d="M292 1216 C 300 1194 326 1196 331 1220 Z"/>
      <path d="M290 1300 C 272 1308 262 1320 258 1338" stroke="#02050a" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M352 1300 C 372 1306 382 1318 386 1334" stroke="#02050a" stroke-width="10" fill="none" stroke-linecap="round"/>
      <rect x="304" y="1252" width="22" height="14" rx="3" fill="#cfe8ff" opacity="0.4"/>
    </g>
    <g transform="translate(90,0)">
      <ellipse cx="900" cy="1500" rx="58" ry="8" opacity="0.5" fill="#010306" filter="url(#soft12b)"/>
      <path d="M874 1498 L880 1330 L920 1330 L926 1498 Z"/>
      <path d="M878 1336 C 882 1258 922 1252 930 1282 L934 1332 C 924 1346 900 1348 888 1340 Z"/>
      <circle cx="912" cy="1232" r="24"/>
      <path d="M892 1216 C 900 1194 926 1196 931 1220 Z"/>
      <path d="M890 1300 C 872 1308 862 1320 858 1338" stroke="#02050a" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M952 1300 C 972 1306 982 1318 986 1334" stroke="#02050a" stroke-width="10" fill="none" stroke-linecap="round"/>
      <rect x="904" y="1252" width="22" height="14" rx="3" fill="#cfe8ff" opacity="0.4"/>
    </g>
  </g>

  <!-- пыль -->
  <ellipse cx="600" cy="1010" rx="320" ry="170" fill="#8fc4ee" opacity="0.05" filter="url(#soft12)"/>
  <g fill="#cfe6ff" opacity="0.3">
    <circle cx="410" cy="1160" r="1.6"/><circle cx="500" cy="1240" r="1.2"/>
    <circle cx="720" cy="1180" r="1.5"/><circle cx="820" cy="1250" r="1.3"/>
    <circle cx="330" cy="1340" r="1.4"/><circle cx="880" cy="1360" r="1.2"/>
  </g>

  <!-- ================= текст ================= -->
  <text x="86" y="452" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="240"
        font-weight="700" letter-spacing="16" fill="#f6faff">ШОВ</text>
  <text x="98" y="552" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="88"
        fill="#a7c6ef" letter-spacing="8">Двое</text>
  <text x="102" y="620" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="28"
        letter-spacing="6" fill="#5f7ba6">КНИГА ДВЕНАДЦАТАЯ</text>

  <rect width="1200" height="1800" fill="url(#vignette12)"/>
</svg>
