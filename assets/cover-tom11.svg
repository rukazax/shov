<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800" role="img" aria-label="Шов. Книга одиннадцатая: Долг — обложка">
<defs>
    <linearGradient id="sky11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060a"/>
      <stop offset="0.34" stop-color="#070d15"/>
      <stop offset="0.68" stop-color="#0a1420"/>
      <stop offset="1" stop-color="#03060b"/>
    </linearGradient>
    <radialGradient id="core11" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#d6ecff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#8fbfe8" stop-opacity="0.20"/>
      <stop offset="0.75" stop-color="#3d5c7c" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#080e16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="far11" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe8ff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#6f9dc8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0a1420" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread11" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ccaf0" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#bcdcf6" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#e8f5ff" stop-opacity="0.85"/>
      <stop offset="0.72" stop-color="#bcdcf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9ccaf0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge11" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fb6ee" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#cfeaff" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#9ed4ff" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#cfeaff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#6fb6ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1826"/>
      <stop offset="0.5" stop-color="#070c14"/>
      <stop offset="1" stop-color="#02040a"/>
    </linearGradient>
    <radialGradient id="vignette11" cx="0.5" cy="0.42" r="0.92">
      <stop offset="0.36" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="soft11"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="soft11b"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="glow11"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain11">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
</defs>

  
  <rect width="1200" height="1800" fill="url(#sky11)"/>

  <!-- раскрытая книга реестра: две страницы, строки долга -->
  <g>
    <ellipse cx="600" cy="1500" rx="520" ry="150" fill="#0a1420" opacity="0.9"/>
    <path d="M120 1260 L600 1180 L600 1660 L120 1560 Z" fill="#0f1a26"/>
    <path d="M1080 1260 L600 1180 L600 1660 L1080 1560 Z" fill="#0c1620"/>
    <path d="M600 1180 L600 1660" stroke="#1e3247" stroke-width="4"/>
    <g stroke="#2b4256" stroke-width="2" opacity="0.85">
      <path d="M170 1300 L560 1230"/><path d="M170 1340 L560 1272"/>
      <path d="M170 1380 L560 1314"/><path d="M170 1420 L560 1356"/>
      <path d="M170 1460 L560 1398"/><path d="M170 1500 L560 1440"/>
      <path d="M170 1540 L560 1482"/>
      <path d="M640 1232 L1030 1302"/><path d="M640 1274 L1030 1342"/>
      <path d="M640 1316 L1030 1382"/><path d="M640 1358 L1030 1422"/>
      <path d="M640 1400 L1030 1462"/><path d="M640 1442 L1030 1502"/>
    </g>
    <!-- штамп метки на левой странице -->
    <g transform="rotate(-7 360 1470)" opacity="0.92">
      <rect x="250" y="1418" width="230" height="104" fill="none" stroke="#cfe8ff" stroke-width="5" opacity="0.75"/>
      <text x="266" y="1492" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="66"
            font-weight="700" fill="#cfe8ff" opacity="0.8" letter-spacing="6">У-3</text>
    </g>
    <!-- свет над книгой -->
    <ellipse cx="600" cy="1200" rx="420" ry="240" fill="url(#core11)" filter="url(#soft11)" opacity="0.55"/>
  </g>

  <!-- фигура: человек с биркой, стоит за книгой -->
  <g fill="#02050a" transform="translate(600,1196) scale(1.14) translate(-600,-1120)">
    <ellipse cx="600" cy="1180" rx="66" ry="9" opacity="0.55" fill="#010306" filter="url(#soft11b)"/>
    <path d="M568 1178 L574 1072 L626 1072 L632 1178 Z"/>
    <path d="M572 1080 C 576 986 626 978 636 1016 L642 1076 C 630 1092 604 1094 590 1086 Z"/>
    <circle cx="622" cy="958" r="29"/>
    <path d="M600 940 C 610 914 642 916 648 944 Z"/>
    <path d="M588 1030 C 566 1036 552 1052 548 1070" stroke="#02050a" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M548 1070 L530 1100" stroke="#02050a" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M634 1030 C 656 1036 668 1050 672 1066" stroke="#02050a" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M672 1066 L690 1094" stroke="#02050a" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- бирка на шнурке -->
    <g>
      <path d="M622 986 C 626 1004 632 1016 634 1028" stroke="#0a0f16" stroke-width="3" fill="none"/>
      <rect x="628" y="1028" width="26" height="16" rx="3" fill="#cfe8ff" opacity="0.55"/>
    </g>
  </g>

  <!-- пыль и дальний свет -->
  <ellipse cx="600" cy="980" rx="300" ry="160" fill="#8fc4ee" opacity="0.06" filter="url(#soft11)"/>
  <g fill="#cfe6ff" opacity="0.32">
    <circle cx="380" cy="1240" r="1.6"/><circle cx="470" cy="1330" r="1.2"/>
    <circle cx="760" cy="1265" r="1.5"/><circle cx="840" cy="1350" r="1.3"/>
    <circle cx="300" cy="1420" r="1.4"/>
  </g>

  <!-- ================= текст ================= -->
  <text x="86" y="452" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="240"
        font-weight="700" letter-spacing="16" fill="#f6faff">ШОВ</text>
  <text x="98" y="552" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="88"
        fill="#a7c6ef" letter-spacing="8">Долг</text>
  <text x="102" y="620" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="28"
        letter-spacing="6" fill="#5f7ba6">КНИГА ОДИННАДЦАТАЯ</text>

  <rect width="1200" height="1800" fill="url(#vignette10)"/>
  <rect width="1200" height="1800" filter="url(#grain10)" opacity="0.05"/>
</svg>
