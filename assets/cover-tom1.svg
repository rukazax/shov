<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800" role="img" aria-label="Шов. Книга первая: Щепка — обложка">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060b"/>
      <stop offset="0.45" stop-color="#0a111c"/>
      <stop offset="1" stop-color="#04070c"/>
    </linearGradient>
    <linearGradient id="seamGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#7ab8ff"/>
      <stop offset="0.5" stop-color="#eaf4ff"/>
      <stop offset="0.82" stop-color="#7ab8ff"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c121c"/>
      <stop offset="0.5" stop-color="#060a11"/>
      <stop offset="1" stop-color="#0c121c"/>
    </linearGradient>
    <linearGradient id="leak" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8f4ff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#9cc6ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9cc6ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="crackGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dcebff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#dcebff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="shaftArea"><rect x="0" y="700" width="1200" height="880"/></clipPath>
  </defs>

  <rect width="1200" height="1800" fill="url(#sky)"/>

  <!-- звёзды -->
  <g fill="#bcd6ff">
    <circle cx="120" cy="110" r="1.6" opacity="0.45"/><circle cx="300" cy="64" r="1.1" opacity="0.3"/>
    <circle cx="470" cy="140" r="1.3" opacity="0.35"/><circle cx="700" cy="86" r="1.7" opacity="0.5"/>
    <circle cx="880" cy="130" r="1.2" opacity="0.3"/><circle cx="1010" cy="70" r="1.5" opacity="0.4"/>
    <circle cx="1110" cy="160" r="1.1" opacity="0.28"/><circle cx="210" cy="215" r="1" opacity="0.22"/>
    <circle cx="820" cy="196" r="1.2" opacity="0.26"/><circle cx="560" cy="236" r="1" opacity="0.2"/>
  </g>

  <!-- шов в небе -->
  <g filter="url(#soft)" opacity="0.8">
    <path d="M30 300 L150 292 L270 304 L390 290 L510 302 L630 288 L750 300 L870 286
             L990 298 L1110 284 L1180 296" fill="none" stroke="url(#seamGlow)" stroke-width="8"/>
  </g>
  <path d="M30 300 L150 292 L270 304 L390 290 L510 302 L630 288 L750 300 L870 286
           L990 298 L1110 284 L1180 296" fill="none" stroke="url(#seamGlow)" stroke-width="2.4"/>
  <g stroke="#b3d4ff" stroke-opacity="0.65" stroke-width="1.8" stroke-linecap="round">
    <line x1="150" y1="278" x2="144" y2="306"/><line x1="390" y1="276" x2="384" y2="304"/>
    <line x1="630" y1="274" x2="624" y2="302"/><line x1="870" y1="272" x2="864" y2="300"/>
    <line x1="1110" y1="270" x2="1104" y2="298"/>
  </g>

  <!-- название -->
  <text x="96" y="196" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="28"
        letter-spacing="9" fill="#7d9bc6">СЕРИЯ НА 30 ТОМОВ</text>
  <text x="86" y="500" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="240"
        font-weight="700" letter-spacing="16" fill="#f4f8ff">ШОВ</text>
  <text x="98" y="596" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="86"
        fill="#a7c6ef" letter-spacing="8">Щепка</text>
  <text x="102" y="652" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="28"
        letter-spacing="6" fill="#5f7ba6">КНИГА ПЕРВАЯ</text>

  <!-- ствол шахты -->
  <g clip-path="url(#shaftArea)">
    <rect x="0" y="700" width="1200" height="880" fill="#05080e"/>

    <!-- боковые породы -->
    <path d="M0 700 L150 700 L150 1580 L0 1580 Z" fill="url(#wall)"/>
    <path d="M1200 700 L1050 700 L1050 1580 L1200 1580 Z" fill="url(#wall)"/>

    <!-- крепь: рамы уходят вниз -->
    <g stroke="#141d28" stroke-width="8" stroke-linecap="square">
      <line x1="150" y1="760" x2="1050" y2="760"/>
      <line x1="168" y1="900" x2="1032" y2="900"/>
      <line x1="186" y1="1040" x2="1014" y2="1040"/>
      <line x1="204" y1="1180" x2="996" y2="1180"/>
      <line x1="222" y1="1320" x2="978" y2="1320"/>
      <line x1="240" y1="1460" x2="960" y2="1460"/>
    </g>
    <g stroke="#131c28" stroke-width="14" stroke-linecap="square">
      <line x1="176" y1="760" x2="176" y2="900"/>
      <line x1="1024" y1="760" x2="1024" y2="900"/>
      <line x1="212" y1="900" x2="212" y2="1040"/>
      <line x1="988" y1="900" x2="988" y2="1040"/>
      <line x1="248" y1="1040" x2="248" y2="1180"/>
      <line x1="952" y1="1040" x2="952" y2="1180"/>
    </g>

    <!-- направляющие -->
    <line x1="520" y1="700" x2="520" y2="1580" stroke="#1d2937" stroke-width="7"/>
    <line x1="680" y1="700" x2="680" y2="1580" stroke="#1d2937" stroke-width="7"/>

    <!-- тросы -->
    <line x1="566" y1="700" x2="566" y2="1092" stroke="#26333f" stroke-width="4"/>
    <line x1="634" y1="700" x2="634" y2="1092" stroke="#26333f" stroke-width="4"/>

    <!-- свет от протечки внизу -->
    <ellipse cx="600" cy="1420" rx="330" ry="180" fill="url(#crackGlow)"/>
    <rect x="589" y="1000" width="22" height="580" fill="url(#leak)" filter="url(#soft)"/>

    <!-- клеть -->
    <g>
      <rect x="506" y="1092" width="188" height="162" fill="#0b121c" stroke="#2f4257" stroke-width="6"/>
      <g stroke="#31465d" stroke-width="3">
        <line x1="536" y1="1092" x2="536" y2="1254"/>
        <line x1="572" y1="1092" x2="572" y2="1254"/>
        <line x1="608" y1="1092" x2="608" y2="1254"/>
        <line x1="644" y1="1092" x2="644" y2="1254"/>
        <line x1="680" y1="1092" x2="680" y2="1254"/>
      </g>
      <line x1="506" y1="1104" x2="694" y2="1104" stroke="#cfe4ff" stroke-width="3" opacity="0.35"/>
      <rect x="506" y="1092" width="188" height="162" fill="none" stroke="#415a73" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- трещина в стене, откуда сочится геометрия -->
    <ellipse cx="318" cy="1300" rx="70" ry="300" fill="url(#crackGlow)" opacity="0.5"/>
    <path d="M296 1520 L326 1400 L304 1300 L334 1200 L310 1110 L340 1030"
          fill="none" stroke="#9cc6ff" stroke-width="7" opacity="0.35" filter="url(#soft)"/>
    <path d="M296 1520 L326 1400 L304 1300 L334 1200 L310 1110 L340 1030"
          fill="none" stroke="#e6f2ff" stroke-width="2.2" opacity="0.8"/>
    <path d="M310 1460 L360 1500 M312 1330 L356 1380 M318 1210 L362 1250"
          stroke="#cfe4ff" stroke-width="1.4" opacity="0.45"/>

    <!-- пыль -->
    <g fill="#cfe0f7" opacity="0.35">
      <circle cx="470" cy="1180" r="1.4"/><circle cx="700" cy="1240" r="1.2"/>
      <circle cx="530" cy="1330" r="1.6"/><circle cx="660" cy="1380" r="1.1"/>
      <circle cx="420" cy="1270" r="1"/><circle cx="760" cy="1150" r="1.3"/>
      <circle cx="600" cy="1470" r="1.5"/><circle cx="360" cy="1400" r="1"/>
    </g>

    <!-- затемнение к краям -->
    <rect x="0" y="700" width="1200" height="880" fill="none"/>
    <rect x="0" y="700" width="120" height="880" fill="#04060b" opacity="0.75"/>
    <rect x="1080" y="700" width="120" height="880" fill="#04060b" opacity="0.75"/>
    <rect x="0" y="1460" width="1200" height="120" fill="#04060b" opacity="0.8"/>
  </g>

  <!-- нижняя плашка -->
  <line x1="96" y1="1614" x2="1104" y2="1614" stroke="#22303f" stroke-width="2"/>
  <text x="96" y="1686" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="42"
        fill="#dbe8fa">Там мы. Только без нас.</text>
  <text x="96" y="1748" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="24"
        letter-spacing="4" fill="#63799b">НИЖНИЙ ТАГИЛ · ШАХТА «КАПИТАЛЬНАЯ» · 2029</text>

  <rect width="1200" height="1800" filter="url(#grain)" opacity="0.05"/>
</svg>
