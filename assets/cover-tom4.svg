<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1600" height="2400" role="img" aria-label="Шов. Книга четвёртая: Опора — обложка">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060b"/>
      <stop offset="0.35" stop-color="#0a121c"/>
      <stop offset="0.72" stop-color="#101826"/>
      <stop offset="1" stop-color="#04070c"/>
    </linearGradient>
    <linearGradient id="doorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe9ff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#8fb4e8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3d5c82" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="pillarFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050a12"/>
      <stop offset="0.5" stop-color="#16243a"/>
      <stop offset="1" stop-color="#050a12"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd48a" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffbe62" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffbe62" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe2ff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#6f9fd8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0a1421" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="1800" fill="url(#sky)"/>

  <!-- развалины города на горизонте: обрушенные углы, разлом -->
  <g fill="#132335" opacity="0.95">
    <path d="M0 1010 L120 1010 L120 940 L180 940 L180 1010 L300 1010 L300 900 L360 900 L360 1010 L1200 1010 L1200 1100 L0 1100 Z"/>
  </g>
  <g stroke="#22405c" stroke-width="2" opacity="0.8">
    <path d="M60 1010 L60 960"/><path d="M240 1010 L240 950"/><path d="M330 1010 L330 920"/>
  </g>

  <!-- трещина по земле -->
  <path d="M0 1420 L180 1396 L300 1430 L420 1408" stroke="#16283c" stroke-width="4" fill="none" opacity="0.85"/>
  <path d="M780 1404 L900 1432 L1040 1400 L1200 1424" stroke="#16283c" stroke-width="4" fill="none" opacity="0.85"/>

  <!-- дверь: проём в воздухе, свет изнутри -->
  <g>
    <ellipse cx="600" cy="1180" rx="300" ry="360" fill="url(#halo)"/>
    <rect x="470" y="860" width="260" height="640" fill="url(#doorGlow)" opacity="0.5" filter="url(#soft)"/>
    <rect x="492" y="884" width="216" height="616" fill="#0b1420" opacity="0.55"/>
    <rect x="492" y="884" width="216" height="616" fill="none" stroke="#9cc6f5" stroke-width="3" opacity="0.8"/>
    <rect x="504" y="896" width="192" height="592" fill="url(#doorGlow)" opacity="0.28"/>
    <!-- ручка -->
    <circle cx="672" cy="1200" r="7" fill="#e8f1ff" opacity="0.85"/>
    <circle cx="672" cy="1200" r="16" fill="#cfe2ff" opacity="0.22" filter="url(#tiny)"/>
    <!-- стук: две волны у двери -->
    <g stroke="#cfe2ff" stroke-width="2" fill="none" opacity="0.5">
      <path d="M760 1120 C800 1160 800 1220 760 1260"/>
      <path d="M800 1096 C856 1152 856 1228 800 1284"/>
    </g>
  </g>

  <!-- опоры оцепления: два бетонных блока по краям -->
  <g>
    <path d="M400 1500 L470 1500 L478 1800 L392 1800 Z" fill="url(#pillarFill)"/>
    <path d="M730 1500 L800 1500 L808 1800 L722 1800 Z" fill="url(#pillarFill)"/>
    <path d="M470 1560 L730 1556" stroke="#3d5c82" stroke-width="2" stroke-dasharray="14 10" opacity="0.6"/>
  </g>

  <!-- земля -->
  <path d="M0 1800 L0 1500 L392 1500 L392 1800 Z" fill="#04070c"/>
  <path d="M808 1800 L808 1500 L1200 1500 L1200 1800 Z" fill="#04070c"/>

  <!-- ребёнок с компасом у двери -->
  <g transform="translate(556 1452) scale(0.54)">
    <path d="M0 0 C-8 -30 -6 -62 2 -82 C8 -98 30 -98 36 -80 C44 -60 46 -28 40 2 Z" fill="#02050a"/>
    <circle cx="21" cy="-96" r="22" fill="#02050a"/>
    <path d="M18 -70 L-14 -34" stroke="#02050a" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-20" cy="-26" r="10" fill="#9cc6f5"/>
    <circle cx="-20" cy="-26" r="34" fill="#cfe2ff" opacity="0.28" filter="url(#tiny)"/>
    <path d="M10 0 L4 40 M26 0 L32 38" stroke="#02050a" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- второй силуэт с той стороны двери, едва виден -->
  <g transform="translate(628 1330) scale(0.62)" opacity="0.55">
    <path d="M-14 0 C-18 -34 -14 -70 -4 -88 C-18 -92 -22 -104 -14 -114 C-8 -122 4 -124 12 -118 L34 -102 C44 -94 46 -78 38 -68 C32 -60 20 -58 12 -64 C14 -46 18 -22 16 2 Z" fill="#cfe2ff"/>
    <circle cx="6" cy="-124" r="15" fill="#cfe2ff"/>
  </g>

  <!-- текст -->
  <text x="96" y="196" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="28"
        letter-spacing="9" fill="#7d9bc6">КОНСТАНТИН ЕРЁМИН</text>
  <text x="86" y="500" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="240"
        font-weight="700" letter-spacing="16" fill="#f4f8ff">ШОВ</text>
  <text x="98" y="596" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="86"
        fill="#a7c6ef" letter-spacing="10">Опора</text>
  <text x="102" y="652" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="28"
        letter-spacing="6" fill="#5f7ba6">КНИГА ЧЕТВЁРТАЯ</text>

  <!-- нижняя плашка -->
  <rect x="0" y="1600" width="1200" height="200" fill="#04070c" opacity="0.82"/>
  <line x1="96" y1="1642" x2="1104" y2="1642" stroke="#2a4568" stroke-width="1.5"/>
  <text x="96" y="1690" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="42"
        fill="#dbe8fa">Держать – только тот, кто согласен остаться.</text>
  <text x="96" y="1748" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="24"
        letter-spacing="4" fill="#63799b">НИЖНИЙ ТАГИЛ · ОТСЕЛЕНИЕ · 2029</text>

  <rect width="1200" height="1800" filter="url(#grain)" opacity="0.05"/>
</svg>
