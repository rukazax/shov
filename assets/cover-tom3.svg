<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800" role="img" aria-label="Шов. Книга третья: Мост — обложка">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.38" stop-color="#0b1420"/>
      <stop offset="0.7" stop-color="#101b28"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="seamGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#8cc0ff"/>
      <stop offset="0.5" stop-color="#f2f8ff"/>
      <stop offset="0.75" stop-color="#8cc0ff"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spanTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3f5c"/>
      <stop offset="1" stop-color="#0a1421"/>
    </linearGradient>
    <linearGradient id="pierFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050a12"/>
      <stop offset="0.5" stop-color="#16243a"/>
      <stop offset="1" stop-color="#050a12"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd48a" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffbe62" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffbe62" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chasm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dceaff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#6f9fd8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0a1421" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="1800" fill="url(#sky)"/>

  <!-- дальний хребет -->
  <path d="M0 980 L140 900 L260 950 L390 872 L520 940 L650 890 L790 962 L930 900 L1060 958 L1200 894 L1200 1100 L0 1100 Z"
        fill="#0a1420" opacity="0.9"/>

  <!-- пропасть: свечение шва между берегами -->
  <g>
    <ellipse cx="600" cy="1330" rx="330" ry="150" fill="url(#chasm)"/>
    <path d="M300 1290 L900 1300" stroke="url(#seamGlow)" stroke-width="5" opacity="0.85" filter="url(#tiny)"/>
    <path d="M340 1352 L860 1344" stroke="url(#seamGlow)" stroke-width="2.5" opacity="0.5"/>
    <g stroke="#9cc6f5" stroke-width="1" opacity="0.35">
      <path d="M420 1268 L448 1380"/><path d="M520 1276 L536 1390"/>
      <path d="M680 1278 L666 1392"/><path d="M780 1270 L752 1382"/>
    </g>
  </g>

  <!-- берега -->
  <path d="M0 1800 L0 1330 L300 1290 L300 1800 Z" fill="#050a11"/>
  <path d="M1200 1800 L1200 1330 L900 1300 L900 1800 Z" fill="#050a11"/>

  <!-- быки моста -->
  <g>
    <path d="M286 1300 L370 1300 L392 1800 L264 1800 Z" fill="url(#pierFill)"/>
    <path d="M830 1300 L914 1300 L936 1800 L808 1800 Z" fill="url(#pierFill)"/>
  </g>

  <!-- пролёт моста -->
  <g>
    <path d="M300 1290 C420 1180 780 1180 900 1300 L900 1332 C780 1216 420 1216 300 1322 Z"
          fill="url(#spanTop)"/>
    <path d="M300 1290 C420 1180 780 1180 900 1300" fill="none" stroke="#3d5c82" stroke-width="2" opacity="0.8"/>
    <!-- перила -->
    <g stroke="#4a6b93" stroke-width="3" opacity="0.75">
      <path d="M322 1258 L322 1216"/><path d="M402 1226 L402 1184"/>
      <path d="M482 1206 L482 1164"/><path d="M600 1198 L600 1156"/>
      <path d="M718 1206 L718 1164"/><path d="M798 1226 L798 1184"/>
      <path d="M878 1258 L878 1216"/>
    </g>
    <path d="M314 1218 C440 1136 760 1136 886 1218" fill="none" stroke="#5c82ad" stroke-width="3.5" opacity="0.7"/>
    <path d="M600 1160 L600 1198" stroke="#5c82ad" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- идущий с фонарём -->
  <g transform="translate(548 1160) scale(0.5)">
    <g filter="url(#soft)" opacity="0.9">
      <circle cx="-32" cy="-46" r="120" fill="url(#lamp)"/>
    </g>
    <path d="M0 0 C-10 -38 -8 -80 2 -104 C10 -124 34 -124 42 -102 C52 -76 56 -34 46 2 Z" fill="#03060b"/>
    <path d="M6 -118 C10 -140 36 -142 40 -118 C42 -104 36 -96 24 -95 C12 -94 4 -104 6 -118 Z" fill="#03060b"/>
    <path d="M4 -74 L-26 -50" stroke="#03060b" stroke-width="14" stroke-linecap="round"/>
    <circle cx="-34" cy="-44" r="9" fill="#ffd48a"/>
    <circle cx="-34" cy="-44" r="17" fill="#ffd48a" opacity="0.25" filter="url(#tiny)"/>
    <path d="M10 0 L2 46 M32 0 L40 44" stroke="#03060b" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- фигура в форме на дальнем быке -->
  <g transform="translate(884 1216) scale(0.46)" opacity="0.92">
    <path d="M0 0 C-8 -36 -6 -78 2 -102 C10 -122 34 -122 42 -100 C50 -74 54 -32 44 2 Z" fill="#02050a"/>
    <path d="M6 -116 C10 -140 36 -142 40 -116 C42 -102 36 -94 24 -93 C12 -92 4 -102 6 -116 Z" fill="#02050a"/>
    <rect x="-4" y="-84" width="52" height="7" fill="#7d9bc6" opacity="0.55"/>
    <path d="M10 0 L2 46 M32 0 L40 44" stroke="#02050a" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- текст -->
  <text x="96" y="196" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="28"
        letter-spacing="9" fill="#7d9bc6">КОНСТАНТИН ЕРЁМИН</text>
  <text x="86" y="500" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="240"
        font-weight="700" letter-spacing="16" fill="#f4f8ff">ШОВ</text>
  <text x="98" y="596" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="86"
        fill="#a7c6ef" letter-spacing="10">Мост</text>
  <text x="102" y="652" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="28"
        letter-spacing="6" fill="#5f7ba6">КНИГА ТРЕТЬЯ</text>

  <!-- нижняя плашка -->
  <rect x="0" y="1600" width="1200" height="200" fill="#04070c" opacity="0.82"/>
  <line x1="96" y1="1642" x2="1104" y2="1642" stroke="#2a4568" stroke-width="1.5"/>
  <text x="96" y="1690" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="42"
        fill="#dbe8fa">Мост держит не тот, кто идёт.</text>
  <text x="96" y="1748" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="24"
        letter-spacing="4" fill="#63799b">ЕКАТЕРИНБУРГ · УПРАВЛЕНИЕ ПО УРАЛУ · 2030</text>

  <rect width="1200" height="1800" filter="url(#grain)" opacity="0.05"/>
</svg>
